<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LAST ONE</title>
<style>
  *{box-sizing:border-box} body{margin:0;background:#090b10;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
  #game{display:block;width:100vw;height:100vh;touch-action:none}
  #hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-weight:800;text-shadow:0 2px 4px #000}
  .pill{background:#171b25cc;padding:9px 13px;border-radius:14px}
  #center{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  #start{pointer-events:auto;text-align:center;background:#121622ee;border:1px solid #31384a;border-radius:22px;padding:28px;max-width:330px}
  button{border:0;border-radius:14px;padding:13px 22px;font-weight:900;font-size:17px;background:#fff;color:#10131a}
  h1{margin:0 0 8px;font-size:42px} p{color:#b8bfcc;line-height:1.4}
  #msg{position:fixed;top:70px;left:0;right:0;text-align:center;font-size:24px;font-weight:900;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="pill">🏆 <span id="score">0</span></div><div class="pill">⏱️ <span id="time">30</span></div><div class="pill">🔥 Lv <span id="level">1</span></div></div>
<div id="msg"></div>
<div id="center"><div id="start">
<h1>LAST ONE</h1>
<p>Survive for 30 seconds. Move the player, collect coins and avoid the red enemies.</p>
<button id="play">PLAY</button>
<p style="font-size:13px">Mobile: drag anywhere • PC: WASD / Arrow keys</p>
</div></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W,H,dpr,player,enemies,coins,score,time,level,running,last,spawn,coinSpawn,keys={},touch=null;
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
const rand=(a,b)=>a+Math.random()*(b-a);
function reset(){
 player={x:W/2,y:H/2,r:15,s:230}; enemies=[];coins=[];score=0;time=30;level=1;spawn=0;coinSpawn=0;running=true;last=performance.now();
 document.getElementById('center').style.display='none'; requestAnimationFrame(loop);
}
function addEnemy(){
 const side=Math.floor(Math.random()*4), m=30;
 let x=side===0? -m:side===1?W+m:rand(0,W), y=side===2?-m:side===3?H+m:rand(0,H);
 enemies.push({x,y,r:rand(10,17),s:rand(55,85)+level*7});
}
function addCoin(){coins.push({x:rand(25,W-25),y:rand(80,H-25),r:8,a:Math.random()*6.28})}
function end(){
 running=false;
 document.getElementById('center').style.display='flex';
 document.getElementById('start').innerHTML=`<h1>GAME OVER</h1><p>Score: <b>${score}</b><br>Level reached: <b>${level}</b></p><button id="play">PLAY AGAIN</button>`;
 document.getElementById('play').onclick=reset;
}
function update(dt){
 time-=dt;if(time<=0){time=30;level++;document.getElementById('level').textContent=level}
 let dx=0,dy=0;
 if(keys.ArrowLeft||keys.a)dx--;if(keys.ArrowRight||keys.d)dx++;if(keys.ArrowUp||keys.w)dy--;if(keys.ArrowDown||keys.s)dy++;
 if(touch){dx=(touch.x-player.x)/60;dy=(touch.y-player.y)/60}
 const len=Math.hypot(dx,dy)||1; player.x+=dx/len*player.s*dt;player.y+=dy/len*player.s*dt;
 player.x=Math.max(player.r,Math.min(W-player.r,player.x));player.y=Math.max(65+player.r,Math.min(H-player.r,player.y));
 spawn-=dt;coinSpawn-=dt;
 if(spawn<=0){addEnemy();spawn=Math.max(.22,1.0-level*.06)}
 if(coinSpawn<=0){addCoin();coinSpawn=.65}
 enemies.forEach(e=>{let dx=player.x-e.x,dy=player.y-e.y,l=Math.hypot(dx,dy)||1;e.x+=dx/l*e.s*dt;e.y+=dy/l*e.s*dt});
 for(let i=coins.length-1;i>=0;i--){let q=coins[i];q.a+=dt*4;if(Math.hypot(player.x-q.x,player.y-q.y)<player.r+q.r){coins.splice(i,1);score+=10}}
 for(const e of enemies)if(Math.hypot(player.x-e.x,player.y-e.y)<player.r+e.r)return end();
 document.getElementById('score').textContent=score;document.getElementById('time').textContent=Math.ceil(time);
}
function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#0d1119';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#171d29';ctx.lineWidth=1;
 for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
 for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 coins.forEach(q=>{ctx.fillStyle='#ffd84a';ctx.beginPath();ctx.arc(q.x,q.y,q.r+Math.sin(q.a)*2,0,7);ctx.fill()});
 enemies.forEach(e=>{ctx.fillStyle='#ff3b55';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.x-4,e.y-2,2,0,7);ctx.arc(e.x+4,e.y-2,2,0,7);ctx.fill()});
 ctx.fillStyle='#63e6ff';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,7);ctx.fill();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(player.x-5,player.y-3,2.5,0,7);ctx.arc(player.x+5,player.y-3,2.5,0,7);ctx.fill();
}
function loop(t){if(!running)return;let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);
c.addEventListener('pointerdown',e=>touch={x:e.clientX,y:e.clientY});
c.addEventListener('pointermove',e=>{if(touch)touch={x:e.clientX,y:e.clientY}});
addEventListener('pointerup',()=>touch=null);
document.getElementById('play').onclick=reset;
</script>
</body></html>
